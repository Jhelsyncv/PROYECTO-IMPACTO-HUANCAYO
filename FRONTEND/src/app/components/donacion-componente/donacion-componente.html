<div style="max-width: 800px; margin: 2rem auto; font-family: sans-serif;">
  <h2 style="text-align: center;">Registro de Donaciones - Comedores Huancayo</h2>

  <!-- Alerta de Notificación -->
  <div *ngIf="mensaje" [style.background-color]="esError ? '#ffcccc' : '#d4edda'"
       [style.color]="esError ? '#721c24' : '#155724'"
       style="padding: 10px; margin-bottom: 15px; border-radius: 4px; text-align: center;">
    {{ mensaje }}
  </div>

  <!-- Formulario -->
  <form (submit)="guardar($event)" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
    <div>
      <label><b>Alimento / Recurso:</b></label><br>
      <input type="text" [(ngModel)]="nuevaDonacion.item" name="item" style="width: 100%; padding: 8px;" placeholder="Ej. Arroz, Aceite">
    </div>

    <div>
      <label><b>Cantidad (Kg):</b></label><br>
      <input type="number" [(ngModel)]="nuevaDonacion.cantidad_kg" name="cantidad_kg" style="width: 100%; padding: 8px;" min="1">
    </div>

    <div>
      <label><b>Comedor Destino:</b></label><br>
      <input type="text" [(ngModel)]="nuevaDonacion.comedor" name="comedor" style="width: 100%; padding: 8px;" placeholder="Ej. Comedor El Carmen">
    </div>

    <div style="display: flex; gap: 10px;">
      <button type="submit" style="flex: 1; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px;">
        {{ editandoId !== null ? 'Actualizar Donación' : 'Guardar Donación' }}
      </button>
      <button type="button" *ngIf="editandoId !== null" (click)="limpiarFormulario()" style="padding: 10px; background-color: #6c757d; color: white; border: none; cursor: pointer; border-radius: 4px;">
        Cancelar
      </button>
    </div>
  </form>

  <!-- Tabla de Registros -->
  <table border="1" style="width: 100%; border-collapse: collapse; text-align: center;">
    <thead>
      <tr style="background-color: #f2f2f2;">
        <th style="padding: 8px;">#</th>
        <th style="padding: 8px;">Artículo / Alimento</th>
        <th style="padding: 8px;">Cantidad (Kg)</th>
        <th style="padding: 8px;">Comedor Destino</th>
        <th style="padding: 8px;">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let donacion of listaDonaciones; let i = index">
        <td style="padding: 8px;">{{ i + 1 }}</td>
        <td style="padding: 8px;">{{ donacion.item }}</td>
        <td style="padding: 8px;">{{ donacion.cantidad_kg }}</td>
        <td style="padding: 8px;">{{ donacion.comedor }}</td>
        <td style="padding: 8px; display: flex; justify-content: center; gap: 5px;">
          <button (click)="seleccionarParaEditar(donacion)" style="background-color: #ffc107; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px;">Editar</button>
          <button (click)="eliminar(donacion.id)" style="background-color: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px;">Eliminar</button>
        </td>
      </tr>
      <tr *ngIf="listaDonaciones.length === 0">
        <td colspan="5" style="padding: 12px; color: #666;">No hay donaciones registradas.</td>
      </tr>
    </tbody>
  </table>
</div>
